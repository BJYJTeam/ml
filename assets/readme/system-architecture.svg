<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1180" viewBox="0 0 1700 1180">
<defs>
  <marker id="arrowEnd" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0,0 L10,5 L0,10 Z" fill="#343a40"/>
  </marker>
  <marker id="arrowStart" markerWidth="10" markerHeight="10" refX="1" refY="5" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M10,0 L0,5 L10,10 Z" fill="#343a40"/>
  </marker>
  <style>
    .title{font:700 36px Arial,Helvetica,sans-serif;fill:#15171a;text-anchor:middle}
    .head{font:700 22px Arial,Helvetica,sans-serif;fill:#15171a;text-anchor:middle}
    .sub{font:400 16px Arial,Helvetica,sans-serif;fill:#555b63;text-anchor:middle}
    .tiny{font:400 14px Arial,Helvetica,sans-serif;fill:#666c74;text-anchor:middle}
    .boundaryTitle{font:700 18px Arial,Helvetica,sans-serif;fill:#4b5158}
    .box{fill:#fff;stroke:#343a40;stroke-width:2.2}
    .soft{fill:#f7f8fa;stroke:#5e646b;stroke-width:2}
    .group{fill:#fcfcfd;stroke:#a4aab1;stroke-width:1.8;stroke-dasharray:7 6}
    .docker{fill:#fafbfc;stroke:#697078;stroke-width:2.3;stroke-dasharray:10 7}
    .flow{stroke:#343a40;stroke-width:2.1;fill:none;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowEnd)}
    .bi{stroke:#343a40;stroke-width:2.1;fill:none;stroke-linecap:round;stroke-linejoin:round;marker-start:url(#arrowStart);marker-end:url(#arrowEnd)}
  </style>
</defs>

<rect width="1700" height="1180" fill="#ffffff"/>
<text x="850" y="52" class="title">BJYJ System Architecture</text>

<!-- Frontend: above the central Backend -->
<rect x="600" y="90" width="500" height="125" rx="18" class="box"/>
<text x="850" y="130" class="head">Frontend</text>
<text x="850" y="160" class="sub">Next.js 15 · React 19 · TypeScript</text>
<text x="850" y="188" class="tiny">User Q&amp;A · FAQ · Doctor / Admin UI</text>

<!-- Docker deployment boundary -->
<rect x="50" y="285" width="1600" height="665" rx="24" class="docker"/>
<text x="82" y="322" class="boundaryTitle">Docker Deployment</text>

<!-- Left-side persistent storage -->
<rect x="130" y="430" width="310" height="105" rx="16" class="box"/>
<text x="285" y="470" class="head">MySQL 8</text>
<text x="285" y="500" class="tiny">Posts · Comments · FAQ · Metadata</text>

<rect x="130" y="650" width="310" height="105" rx="16" class="box"/>
<text x="285" y="690" class="head">File Storage</text>
<text x="285" y="720" class="tiny">/uploads · Docker Volume</text>

<!-- Central Backend boundary -->
<rect x="575" y="350" width="550" height="500" rx="20" class="group"/>
<text x="850" y="390" class="head">Backend</text>
<text x="850" y="418" class="sub">Kotlin · Spring Boot 3.4.5 · Java 17</text>

<rect x="625" y="475" width="450" height="90" rx="14" class="soft"/>
<text x="850" y="510" class="head">REST API Layer</text>
<text x="850" y="540" class="sub">Post · Doctor · Admin · Migration</text>

<rect x="625" y="635" width="450" height="95" rx="14" class="soft"/>
<text x="850" y="671" class="head">Domain Services</text>
<text x="850" y="701" class="sub">Post · Comment · Search · FAQ · Keyword Migration</text>

<!-- Backend internal flow retained -->
<path d="M850 577 V623" class="flow"/>

<!-- Right-side ML Service boundary -->
<rect x="1175" y="350" width="450" height="500" rx="20" class="group"/>
<text x="1400" y="390" class="head">ML Service</text>
<text x="1400" y="418" class="sub">Python 3.10 · Django REST Framework</text>

<rect x="1195" y="455" width="190" height="92" rx="14" class="box"/>
<text x="1290" y="488" class="head">Retrieval</text>
<text x="1290" y="515" class="sub">MiniLM (SBERT)</text>
<text x="1290" y="536" class="tiny">Similar Q&amp;A Search</text>

<rect x="1415" y="455" width="190" height="92" rx="14" class="box"/>
<text x="1510" y="488" class="head">FAQ Clustering</text>
<text x="1510" y="515" class="sub">HDBSCAN</text>
<text x="1510" y="536" class="tiny">Topic Discovery</text>

<rect x="1215" y="590" width="370" height="90" rx="14" class="soft"/>
<text x="1400" y="625" class="head">AI API Layer</text>
<text x="1400" y="655" class="sub">Retrieval · Answer · FAQ · Doctor Draft · Images</text>

<rect x="1195" y="725" width="190" height="78" rx="14" class="box"/>
<text x="1290" y="757" class="head">LLM Client</text>
<text x="1290" y="783" class="tiny">Answer · FAQ · Doctor Draft</text>

<rect x="1415" y="725" width="190" height="78" rx="14" class="box"/>
<text x="1510" y="757" class="head">Image Retrieval</text>
<text x="1510" y="783" class="tiny">MiniLM · Metadata Ranking</text>

<!-- ML internal connections: API Layer centered between upper and lower modules -->
<path d="M1290 590 V559" class="flow"/>
<path d="M1510 590 V559" class="flow"/>
<path d="M1290 692 V713" class="flow"/>
<path d="M1510 692 V713" class="flow"/>

<!-- External/system-level connections: anchored to dashed service boundaries -->
<!-- Frontend <-> Backend: terminates at Backend dashed top boundary -->
<path d="M850 215 V350" class="bi"/>
<text x="878" y="282" class="tiny" text-anchor="start">HTTP request / response</text>

<!-- MySQL <-> Backend: terminates at Backend dashed left boundary -->
<path d="M440 482 H575" class="bi"/>
<text x="507" y="465" class="tiny">JPA / QueryDSL</text>

<!-- File Storage <-> Backend: terminates at Backend dashed left boundary -->
<path d="M440 702 H575" class="bi"/>
<text x="507" y="685" class="tiny">File read / write</text>

<!-- Backend <-> ML Service: dashed boundary to dashed boundary -->
<path d="M1125 520 H1175" class="bi"/>
<text x="1150" y="500" class="tiny">REST API</text>

<!-- External Gemma below Backend -->
<rect x="600" y="1020" width="500" height="90" rx="18" class="box"/>
<text x="850" y="1055" class="head">External Gemma 3 12B API</text>
<text x="850" y="1084" class="sub">Remote Generation Endpoint</text>

<!-- ML Service <-> Gemma: starts at ML dashed bottom boundary and ends at Gemma box -->
<path d="M1400 850 V930 H850 V1020" class="bi"/>
<text x="1125" y="914" class="tiny">Gemma API request / response</text>

</svg>
