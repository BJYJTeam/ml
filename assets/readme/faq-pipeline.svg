  <path d="M235 205 L235 265" class="line"/>
  <path d="M235 375 L235 435" class="line"/>
  <path d="M235 545 L235 605" class="line"/>
  <path d="M400 660 L500 660 L500 235 L600 235" class="line"/>
  <path d="M765 290 L765 350" class="line"/>
  <path d="M765 460 L765 520" class="line"/>
  <path d="M765 630 L765 670" class="line"/>
