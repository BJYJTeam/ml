<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#111"/>
    </marker>
    <style>
      .box{fill:#fff;stroke:#111;stroke-width:3;rx:18;ry:18}
      .txt{font:700 24px Arial,Helvetica,sans-serif;fill:#111;text-anchor:middle}
      .sub{font:500 22px Arial,Helvetica,sans-serif;fill:#111;text-anchor:middle}
      .line{stroke:#111;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect width="1000" height="760" fill="#fff"/>

  <text x="500" y="48" class="txt">FAQ Batch Pipeline</text>

  <rect x="70" y="95" width="330" height="110" class="box"/>
